<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Карта дела</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            color: #222;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        h1 {
            margin: 0;
        }

        button {
            cursor: pointer;
            border: 0;
            border-radius: 8px;
            padding: 10px 16px;
            font-size: 14px;
        }

        .add-button {
            background: #222;
            color: white;
        }

        .case-card,
        .case-form {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
        }

        .case-card h2 {
            margin-top: 0;
            margin-bottom: 20px;
        }

        .field {
            margin-bottom: 10px;
        }

        .label {
            font-weight: bold;
        }

        .case-form {
            display: none;
        }

        .case-form.visible {
            display: block;
        }

        .form-row {
            margin-bottom: 15px;
        }

        .form-row label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .form-row input,
        .form-row select {
            width: 100%;
            box-sizing: border-box;
            padding: 9px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .save-button {
            background: #222;
            color: white;
        }
    /* ===== KANBAN ===== */

.container {
    max-width: 1600px;
}

.kanban-board {
    display: grid;
    grid-template-columns: repeat(5, minmax(240px, 1fr));
    gap: 16px;
    align-items: start;
    overflow-x: auto;
    padding-bottom: 20px;
}

.kanban-column {
    background: #e9e9e9;
    border-radius: 12px;
    padding: 14px;
    min-height: 500px;
}

.kanban-column > h2 {
    margin: 0 0 15px 0;
    font-size: 18px;
}

.kanban-column .case-card {
    margin-bottom: 12px;
}</style>
</head>

<body>

<div class="container">

    <div class="top-bar">
        <h1>Карта дела</h1>

        <button class="add-button" id="showFormButton">
            Добавить дело
        </button>
    </div>

    <div class="case-form" id="caseForm">

        <h2>Новое дело</h2>

        <div class="form-row">
            <label for="client">Клиент</label>
            <input type="text" id="client">
        </div>

        <div class="form-row">
            <label for="category">Категория</label>
            <input type="text" id="category">
        </div>

        <div class="form-row">
            <label for="stage">Стадия</label>
            <input type="text" id="stage">
        </div>

        <div class="form-row">
            <label for="nextAction">Следующее действие</label>
            <input type="text" id="nextAction">
        </div>

        <div class="form-row">
            <label for="deadline">Срок</label>
            <input type="date" id="deadline">
        </div>

        <div class="form-row">
            <label for="priority">Приоритет</label>

            <select id="priority">
                <option value="Высокий">Высокий</option>
                <option value="Средний">Средний</option>
                <option value="Низкий">Низкий</option>
            </select>
        </div>

        <button class="save-button" id="saveButton">
            Сохранить
        </button>

    </div>

<div class="kanban-board">

    <div class="kanban-column">
        <h2>Входящие</h2>
        <div id="casesContainer"></div>
    </div>

    <div class="kanban-column">
        <h2>На этой неделе</h2>
        <div id="weekContainer"></div>
    </div>

    <div class="kanban-column">
        <h2>В работе</h2>
        <div id="workContainer"></div>
    </div>

    <div class="kanban-column">
        <h2>Ожидаю / делегировано</h2>
        <div id="waitingContainer"></div>
    </div>

    <div class="kanban-column">
        <h2>Готово</h2>
        <div id="doneContainer"></div>
    </div>

</div>
</div>

<script>
    const showFormButton = document.getElementById("showFormButton");
    const caseForm = document.getElementById("caseForm");
    const saveButton = document.getElementById("saveButton");
    const casesContainer = document.getElementById("casesContainer");

    let cases = [];
    let editingCaseId = null;

    async function loadCasesFromServer() {
        const response = await fetch("/api/cases");
        cases = await response.json();

        renderCases();
    }

    async function deleteCase(id) {
        await fetch(`/api/cases/${id}`, {
            method: "DELETE"
        });

        await loadCasesFromServer();
    }
function editCase(id) {
    const caseItem = cases.find(item => item.id === id);

    if (!caseItem) {
        return;
    }

    editingCaseId = id;

    document.getElementById("client").value = caseItem.client;
    document.getElementById("category").value = caseItem.category;
    document.getElementById("stage").value = caseItem.stage;
    document.getElementById("nextAction").value = caseItem.next_action;
    document.getElementById("deadline").value = caseItem.deadline;
    document.getElementById("priority").value = caseItem.priority;

    caseForm.classList.add("visible");
}
    function renderCases() {
        casesContainer.innerHTML = "";

        cases.forEach((caseItem) => {
            const card = document.createElement("div");
            card.className = "case-card";

            card.innerHTML = `
                <h2>${caseItem.client}</h2>

                <div class="field">
                    <span class="label">Клиент:</span>
                    ${caseItem.client}
                </div>

                <div class="field">
                    <span class="label">Категория:</span>
                    ${caseItem.category}
                </div>

                <div class="field">
                    <span class="label">Стадия:</span>
                    ${caseItem.stage}
                </div>

                <div class="field">
                    <span class="label">Следующее действие:</span>
                    ${caseItem.next_action}
                </div>

                <div class="field">
                    <span class="label">Срок:</span>
                    ${caseItem.deadline}
                </div>

                <div class="field">
                    <span class="label">Приоритет:</span>
                    ${caseItem.priority}
                </div>

<button onclick="editCase(${caseItem.id})">
    Редактировать
</button>                <button onclick="deleteCase(${caseItem.id})">
                    Удалить
                </button>
            `;

            casesContainer.appendChild(card);
        });
    }

    showFormButton.addEventListener("click", function () {
        caseForm.classList.toggle("visible");
    });

    saveButton.addEventListener("click", async function () {
        const client = document.getElementById("client").value;
        const category = document.getElementById("category").value;
        const stage = document.getElementById("stage").value;
        const nextAction = document.getElementById("nextAction").value;
        const deadline = document.getElementById("deadline").value;
        const priority = document.getElementById("priority").value;

        if (client.trim() === "") {
            alert("Укажите клиента");
            return;
        }

        const newCase = {
            client: client,
            category: category,
            stage: stage,
            next_action: nextAction,
            deadline: deadline,
            priority: priority
        };

if (editingCaseId === null) {
    await fetch("/api/cases", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(newCase)
    });
} else {
    await fetch(`/api/cases/${editingCaseId}`, {
        method: "PUT",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(newCase)
    });

    editingCaseId = null;
}

        caseForm.classList.remove("visible");

        document.getElementById("client").value = "";
        document.getElementById("category").value = "";
        document.getElementById("stage").value = "";
        document.getElementById("nextAction").value = "";
        document.getElementById("deadline").value = "";
        document.getElementById("priority").value = "Высокий";

        await loadCasesFromServer();
    });

    loadCasesFromServer();
</script>

</body>
</html>
